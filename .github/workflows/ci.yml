name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Version to release, e.g. 1.2.0 (creates tag vX.Y.Z). Leave empty to only run the tests.'
        required: false
        default: ''

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Syntax check
        run: for f in workflow/*.sh workflow/lib/*.zsh workflow/helper/*.sh scripts/*.sh tests/*.sh; do zsh -n "$f" || exit 1; done
      - name: Test suite (mocked pmset/caffeinate/osascript)
        run: zsh tests/run_tests.sh
      - name: Packaging test
        run: zsh tests/build_test.sh
      - name: Wiki link check
        run: zsh tests/wiki_test.sh
      - name: Menu bar indicator tests (Node, fake Cocoa bridge)
        run: node tests/menubar_test.js
      - name: Compile menu bar script with the real JXA compiler
        if: runner.os == 'macOS'
        run: osacompile -l JavaScript -o "$RUNNER_TEMP/menubar.scpt" workflow/menubar.js
      - name: Lint plists
        if: runner.os == 'macOS'
        run: plutil -lint workflow/info.plist workflow/helper/*.plist
      - name: Build
        run: zsh scripts/build.sh
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: Insomniac.alfredworkflow
          path: dist/*.alfredworkflow

  wiki:
    # Publish docs/wiki to the GitHub wiki on every push to main. GitHub only
    # creates the wiki's git repo once a first page exists, so until someone
    # saves any page at /wiki this job just warns.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Sync docs/wiki → wiki
        env:
          TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git clone --depth 1 "$url" wiki 2>/dev/null; then
            echo "::warning::Wiki not initialized. Save any first page at https://github.com/${GITHUB_REPOSITORY}/wiki/_new, then re-run this job."
            exit 0
          fi
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git add -A
          if git diff --cached --quiet; then echo "Wiki already up to date"; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Sync from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push

  release:
    # Publish a GitHub Release with the .alfredworkflow attached, either by
    # pushing a tag (git push origin v1.2.0) or from Actions → CI →
    # "Run workflow" with a version (the job then creates the tag itself).
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Resolve version
        env:
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="${INPUT_RELEASE#v}"; fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$' || { echo "::error::invalid version '$v'"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "TAG=v$v" >> "$GITHUB_ENV"
      - name: Build (version stamped)
        # Once listed in the Alfred Gallery (repo variable GALLERY_LISTED=true),
        # release the Gallery build: Alfred updates it, so no self-updater.
        env:
          GALLERY_LISTED: ${{ vars.GALLERY_LISTED }}
        run: |
          if [ "$GALLERY_LISTED" = true ]; then
            zsh scripts/build.sh --gallery "$VERSION"
            mv "dist/Insomniac-$VERSION-gallery.alfredworkflow" "dist/Insomniac-$VERSION.alfredworkflow"
            (cd dist && shasum -a 256 "Insomniac-$VERSION.alfredworkflow" > "Insomniac-$VERSION.alfredworkflow.sha256")
            rm -f dist/*-gallery.alfredworkflow.sha256
          else
            zsh scripts/build.sh "$VERSION"
          fi
      - name: Verify package
        run: |
          plutil -lint dist/stage/info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :version' dist/stage/info.plist)" = "$VERSION"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then target=(--verify-tag); else target=(--target "$GITHUB_SHA"); fi
          gh release create "$TAG" dist/*.alfredworkflow dist/*.alfredworkflow.sha256 \
            --title "Insomniac $TAG" --generate-notes "${target[@]}"
